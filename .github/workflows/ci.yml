name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: gofmt -l . && test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: scripts/build.sh
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$(cat VERSION)" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "Release $(cat VERSION)" > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mr-review-*-linux-amd64.tar.gz
            dist/mr-review-*-linux-amd64.tar.gz.sha256
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

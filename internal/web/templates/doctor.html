{{define "content"}}
<section class="page-head"><h1>Проверка окружения</h1><div class="actions"><a class="btn" href="/doctor">Повторить</a></div></section>
<section class="card">
  <table class="table compact">
    <tbody>
    {{range .Report.Checks}}
    <tr>
      <td class="nowrap"><b>{{.Name}}</b></td>
      <td><span class="badge doctor-{{.Status}}">{{.Status}}</span></td>
      <td class="mono small">{{.Detail}}</td>
      <td class="small">{{if ne .Status "OK"}}{{.Fix}}{{end}}</td>
    </tr>
    {{end}}
    </tbody>
  </table>
  <p class="{{if .Report.Ready}}text-success{{else}}text-danger{{end}}">{{if .Report.Ready}}Готово к работе.{{else}}Не готово: исправьте пункты FAIL.{{end}}</p>
</section>
{{end}}
